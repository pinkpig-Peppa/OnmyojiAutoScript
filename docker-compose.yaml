
services:
    OAS:
        network_mode: host
        volumes:
            - '.:/app/OnmyojiAutoScript:rw'
        environment:
            # 用环境变量设置时区：/etc/localtime 在 Windows/macOS 上不存在，挂载会失败
            TZ: Asia/Shanghai
        container_name: 'oas-env'
        image: 'oas-env'
        build:
            context: ./deploy/docker/
            dockerfile: ./Dockerfile
            # dockerfile: ./Dockerfile