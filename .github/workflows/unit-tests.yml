name: Unit Tests & Loop Guard Check

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-guards:
    name: Offline Guard Tests & Static Loop Audit
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-in.txt

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.24.3 opencv-python-headless==4.7.0.72 pydantic==2.10.0 pyyaml==6.0 inflection==0.5.1 rich==13.3.5 wrapt==1.15.0 cached-property anytree==2.8.0 cn2an==0.5.23 pywin32==306 psutil==6.1.1 adbutils==0.11.0 uiautomator2==2.16.17 uiautomator2cache==0.3.0.1 websockets==13.1 filelock pycryptodome av Pillow lxml requests decorator onepush==1.3.0 apprise==2.2.0 cryptography>=42.0.7 zerorpc==0.6.3 pytest

      - name: Compile check all Python sources
        run: |
          python -B -c "import compileall, sys; ok = all(compileall.compile_dir(d, quiet=1) for d in ('module', 'tasks', 'dev_tools')) and compileall.compile_file('script.py', quiet=1) and compileall.compile_file('server.py', quiet=1); sys.exit(0 if ok else 1)"

      - name: Static task loop & BaseTask bound check
        run: |
          python -B dev_tools/audit_task_loops.py . --check

      - name: Run offline unit and guard regression suite
        run: |
          python -B -m pytest `
            tests/test_ocr_filter.py `
            tests/test_hero_test_skill_fallback.py `
            tests/test_mall_appearance.py `
            tests/test_six_realms_island_entry.py `
            tests/test_switch_onmyoji.py `
            tests/test_reliability_guards.py `
            tests/test_shared_bounds_and_loop_audit.py `
            tests/module/atom/test_click.py `
            tests/tasks/Component/Costume/test_costume_switch.py `
            tests/tasks/Component/CostumeTheme/test_theme.py `
            tests/tasks/Component/GeneralBattle/test_battle_wait.py `
            tests/tasks/Component/GeneralBattle/test_randomclick_gate.py `
            tests/tasks/GameUi/test_shared_guild_mask.py `
            tests/tasks/KekkaiUtilize/test_realm_multiscale.py
